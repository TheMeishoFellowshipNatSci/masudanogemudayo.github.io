<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>M.K. OSOUJI GAME</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@700;900&display=swap');
:root{--ink:#171229;--cream:#fff4c7;--red:#ed3b3b;--blue:#2d6cdf;--cyan:#5de1e6;--yellow:#ffd84d;--green:#52c06a}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#171229;color:var(--cream);font-family:'Noto Sans JP',sans-serif;overflow-x:hidden;touch-action:none}
body{background-image:linear-gradient(45deg,#211944 25%,transparent 25%),linear-gradient(-45deg,#211944 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#211944 75%),linear-gradient(-45deg,transparent 75%,#211944 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
.wrap{width:min(980px,100%);margin:auto;padding:12px}.cabinet{border:8px solid var(--cream);box-shadow:0 0 0 6px var(--red),0 0 0 12px var(--ink),10px 10px 0 #080611;background:#29329a;padding:14px}
h1{font:clamp(20px,4vw,38px)/1.35 'Press Start 2P',monospace;text-align:center;color:var(--yellow);text-shadow:4px 4px 0 var(--red);margin:4px 0 15px}.hud{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-bottom:10px}.panel{background:var(--ink);border:4px solid var(--cream);padding:8px;text-align:center;box-shadow:inset -4px -4px 0 #090715}.label{font:10px 'Press Start 2P';color:var(--cyan)}.value{font:clamp(14px,3vw,22px) 'Press Start 2P';margin-top:7px}.meter{height:18px;border:3px solid var(--cream);margin-top:7px;background:#403655}.meter>i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 12px,#88f095 12px 16px);transition:width .2s}
.game{position:relative;width:100%;aspect-ratio:16/10;background:#0b0920;border:6px solid var(--ink);overflow:hidden;cursor:crosshair;image-rendering:auto}.game canvas,.game .photo{position:absolute;inset:0;width:100%;height:100%}.photo{object-fit:cover;user-select:none;-webkit-user-drag:none}.game canvas{z-index:2}.fx{z-index:3;pointer-events:none}.message{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,620px);background:var(--ink);border:5px solid var(--cream);box-shadow:8px 8px 0 var(--red);padding:22px;text-align:center}.message h2{font:clamp(17px,4vw,30px)/1.5 'Press Start 2P';color:var(--yellow);margin:0 0 14px}.message p{line-height:1.7;margin:8px}.btn{font:14px 'Press Start 2P';color:#fff;background:var(--red);border:0;box-shadow:inset -4px -4px 0 #9e1717,5px 5px 0 #080611;padding:14px 20px;margin:10px;cursor:pointer}.btn:active{transform:translate(4px,4px);box-shadow:inset -3px -3px 0 #9e1717,1px 1px 0 #080611}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.tip{font-size:13px;color:#fff}.sound{min-width:auto;padding:10px;font-size:10px}.toast{position:absolute;z-index:6;top:16px;left:50%;transform:translateX(-50%);font:clamp(12px,3vw,20px) 'Press Start 2P';color:#fff;text-shadow:3px 3px 0 #000;background:var(--red);border:4px solid #fff;padding:12px;opacity:0;transition:.15s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;animation:bump .38s steps(2)}.power{animation:rainbow .38s steps(2) infinite}.pickup{position:absolute;z-index:7;width:76px;height:92px;border:4px solid #fff;background:#ffd84d;color:#171229;font:9px/1.25 'Press Start 2P';text-align:center;padding-top:13px;box-shadow:5px 5px 0 #080611;cursor:pointer;animation:hop .55s steps(2) infinite}.pickup:before{content:'';display:block;width:28px;height:14px;background:#fff;margin:-24px auto 8px;border:4px solid #171229}.pickup.mystery{background:#d54cf2;color:#fff}.dangerFlash{animation:danger .18s steps(2) 7}.hidden{display:none!important}@keyframes hop{50%{transform:translateY(-9px)}}@keyframes danger{50%{filter:sepia(1) saturate(8);transform:translate(5px,-3px)}}@keyframes bump{50%{transform:translateX(-50%) scale(1.12)}}@keyframes rainbow{0%{border-color:#ff4}50%{border-color:#4ff}100%{border-color:#f4f}}footer{text-align:center;font:9px/1.7 'Press Start 2P';margin-top:15px;color:#bfc3ff}a{color:var(--cyan)}
@media(max-width:600px){.wrap{padding:4px}.cabinet{padding:7px;border-width:5px}.hud{grid-template-columns:1fr 1fr}.hud .panel:nth-child(2){grid-column:span 2;grid-row:2}.game{aspect-ratio:4/5}.photo{object-position:center}.message{padding:12px}.message p{font-size:12px}.tip{font-size:11px}}
</style></head>
<body><main class="wrap"><section class="cabinet">
<h1>M.K. OSOUJI GAME</h1>
<div class="hud"><div class="panel"><div class="label">SCORE</div><div id="score" class="value">000000</div></div><div class="panel"><div class="label">CLEAN POWER</div><div class="meter"><i id="bar"></i></div></div><div class="panel"><div class="label">TIME</div><div id="time" class="value">60</div></div></div>
<div id="game" class="game"><img class="photo" alt="掃除で現れる背景画像" src="https://raw.githubusercontent.com/TheMeishoFellowshipNatSci/meishosouko/main/4c2be961-8e35-4d26-a92e-c83d914d56fd.jpg"><canvas id="dirt"></canvas><canvas id="fx" class="fx"></canvas><div id="toast" class="toast">POWER UP!</div>
<div id="start" class="message"><h2>READY?</h2><p>泡だらけの画面を、マウスか指でゴシゴシ！<br>ドロ攻撃をかわし、写真をきれいにしよう。<br>洗剤を取って効率アップ？</p><button id="startBtn" class="btn">START</button></div>
<div id="result" class="message hidden"><h2 id="resultTitle">CLEAN!</h2><p id="resultText"></p><button id="retryBtn" class="btn">RETRY</button></div></div>
<div class="controls"><div class="tip">操作：ドラッグで掃除 ／ 洗剤もランダムで流れてきます。</div><button id="soundBtn" class="btn sound">SOUND: ON</button></div>
</section><footer>© 2025–2026 The Meisho Fellowship. All Rights Reserved.<br>SFX: SFXMint CC0 / AUDIO FALLBACK: WEB AUDIO</footer></main>
<audio id="sndHit" preload="auto" crossorigin="anonymous" src="https://sfxmint.com/dl/retro-game-hit-02.mp3"></audio>
<audio id="sndPower" preload="auto" crossorigin="anonymous" src="https://sfxmint.com/dl/retro-game-power-up-50.mp3"></audio>
<audio id="sndEnd" preload="auto" crossorigin="anonymous" src="https://sfxmint.com/dl/retro-game-game-over-65.mp3"></audio>
<script>
(()=>{'use strict';
const game=document.querySelector('#game'), dirt=document.querySelector('#dirt'),fx=document.querySelector('#fx');
const ctx=dirt.getContext('2d',{willReadFrequently:true}),fctx=fx.getContext('2d');
const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bar=document.querySelector('#bar'),toast=document.querySelector('#toast');
let running=false,drawing=false,last=null,time=60,score=0,clean=0,powerUntil=0,timer,eventTimer,regenTimer,pickupTimer,soundOn=true,particles=[],finalRush=false;
const aud={hit:document.querySelector('#sndHit'),power:document.querySelector('#sndPower'),end:document.querySelector('#sndEnd')};
function resize(){const r=game.getBoundingClientRect(); [dirt,fx].forEach(c=>{c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);c.style.width=r.width+'px';c.style.height=r.height+'px'}); if(!running)paintFoam()}
function paintFoam(){ctx.globalCompositeOperation='source-over';const w=dirt.width,h=dirt.height;ctx.fillStyle='#bceef2';ctx.fillRect(0,0,w,h);const grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#ecffff');grad.addColorStop(.55,'#8cdde9');grad.addColorStop(1,'#dffff5');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(let i=0;i<750;i++){const r=(5+Math.random()*20)*devicePixelRatio,x=Math.random()*w,y=Math.random()*h;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=`rgba(255,255,255,${.25+Math.random()*.45})`;ctx.fill();ctx.strokeStyle='rgba(45,150,180,.3)';ctx.lineWidth=2*devicePixelRatio;ctx.stroke()}ctx.globalCompositeOperation='destination-out'}
function reset(){clearInterval(timer);clearInterval(regenTimer);clearTimeout(eventTimer);clearTimeout(pickupTimer);removePickup();time=60;score=0;clean=0;powerUntil=0;particles=[];paintFoam();update();document.querySelector('#result').classList.add('hidden');document.querySelector('#start').classList.remove('hidden');running=false}
function start(){document.querySelector('#start').classList.add('hidden');document.querySelector('#result').classList.add('hidden');running=true;finalRush=false;time=60;score=0;clean=0;powerUntil=0;paintFoam();update();timer=setInterval(()=>{time--;if(time===10){finalRush=true;notice('FINAL CLEAN! ぜんぶ落とせ！','power')}update();if(time<=0)finish()},1000);regenTimer=setInterval(()=>{if(running&&!finalRush&&clean>18)foamBack()},2600);scheduleEvent();schedulePickup()}
function update(){scoreEl.textContent=String(score).padStart(6,'0');timeEl.textContent=time;bar.style.width=Math.min(100,clean)+'%';game.classList.toggle('power',Date.now()<powerUntil)}
function pos(e){const r=dirt.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*dirt.width/r.width,y:(p.clientY-r.top)*dirt.height/r.height}}
function scrub(p){if(!running)return;const rad=(Date.now()<powerUntil?58:25)*devicePixelRatio;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=rad*2;if(last){ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke()}ctx.beginPath();ctx.arc(p.x,p.y,rad,0,7);ctx.fill();last=p;spawn(p,Date.now()<powerUntil?'#fff04d':'#ffffff');score+=Date.now()<powerUntil?18:7;estimate();update()}
function estimate(){const d=ctx.getImageData(0,0,dirt.width,dirt.height).data;let transparent=0,total=0;for(let i=3;i<d.length;i+=4*300){total++;if(d[i]<30)transparent++}clean=Math.max(clean,transparent/total*100);if(!finalRush)clean=Math.min(clean,88)}
function mud(mult=1){if(!running)return;ctx.globalCompositeOperation='source-over';for(let i=0;i<Math.round(23*mult);i++){const x=Math.random()*dirt.width,y=Math.random()*dirt.height,r=(20+Math.random()*50)*devicePixelRatio;ctx.fillStyle=i%2?'#69421f':'#49311d';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(x+(Math.random()-.5)*r*2,y+(Math.random()-.5)*r*2,r*.18,0,7);ctx.fill()}}ctx.globalCompositeOperation='destination-out';clean=Math.max(0,clean-18*mult);score=Math.max(0,score-Math.round(450*mult));notice('ドロ こうげき！','mud');play('hit');update()}
function detergent(){if(!running)return;powerUntil=Date.now()+8000;notice('★ SUPER SENZAI ★','power');play('power');for(let i=0;i<60;i++)spawn({x:Math.random()*fx.width,y:Math.random()*fx.height},'#ffe84d');update()}
function scheduleEvent(){eventTimer=setTimeout(()=>{Math.random()<.82?mud():detergent();if(running)scheduleEvent()},2800+Math.random()*2600)}
function foamBack(){if(!running)return;ctx.globalCompositeOperation='source-over';for(let i=0;i<7;i++){const x=Math.random()*dirt.width,y=Math.random()*dirt.height,r=(18+Math.random()*30)*devicePixelRatio;ctx.fillStyle='rgba(205,247,255,.88)';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.globalCompositeOperation='destination-out';clean=Math.max(0,clean-3);update()}
function schedulePickup(){pickupTimer=setTimeout(()=>{if(running)spawnPickup();if(running)schedulePickup()},6500+Math.random()*4500)}
function spawnPickup(){removePickup();const b=document.createElement('button');const bad=Math.random()<.42;b.className='pickup mystery';b.innerHTML='?<br>SENZAI';b.style.left=(8+Math.random()*75)+'%';b.style.top=(18+Math.random()*58)+'%';b.dataset.bad=bad?'1':'0';b.onclick=()=>{if(!running)return;if(b.dataset.bad==='1'){b.innerHTML='DAME<br>SENZAI';notice('DAME SENZAI!!','mud');game.classList.add('dangerFlash');setTimeout(()=>game.classList.remove('dangerFlash'),1300);mud(1.75);play('hit')}else{b.innerHTML='SUPER<br>SENZAI';detergent();score+=700}setTimeout(removePickup,250)};game.appendChild(b);setTimeout(()=>{if(b.isConnected)b.remove()},4000)}
function removePickup(){const b=game.querySelector('.pickup');if(b)b.remove()}
function notice(t,c){toast.textContent=t;toast.style.background=c==='mud'?'#713a1d':'#df3fd2';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
function spawn(p,color){for(let i=0;i<3;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*7*devicePixelRatio,vy:-Math.random()*6*devicePixelRatio,a:1,r:(2+Math.random()*4)*devicePixelRatio,c:color})}
function anim(){fctx.clearRect(0,0,fx.width,fx.height);particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.2*devicePixelRatio;q.a-=.035;fctx.globalAlpha=Math.max(0,q.a);fctx.fillStyle=q.c;fctx.fillRect(q.x,q.y,q.r,q.r)});fctx.globalAlpha=1;particles=particles.filter(q=>q.a>0);requestAnimationFrame(anim)}
function finish(){if(!running)return;running=false;clearInterval(timer);clearInterval(regenTimer);clearTimeout(eventTimer);clearTimeout(pickupTimer);removePickup();estimate();const win=clean>=80;document.querySelector('#resultTitle').textContent=win?'ピッカピカ！':'TIME UP';document.querySelector('#resultText').innerHTML=`そうじ度 ${Math.round(clean)}%<br>SCORE ${String(score).padStart(6,'0')}<br>${win?'おそうじ名人！':'もう一度みがこう！'}`;document.querySelector('#result').classList.remove('hidden');play('end')}
function play(k){if(!soundOn)return;const a=aud[k];a.currentTime=0;a.play().catch(()=>beep(k))}
function beep(k){const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type='square';o.frequency.value=k==='power'?880:k==='hit'?110:220;g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.18);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+.18)}
['mousedown','touchstart'].forEach(n=>dirt.addEventListener(n,e=>{e.preventDefault();drawing=true;last=pos(e);scrub(last)},{passive:false}));['mousemove','touchmove'].forEach(n=>dirt.addEventListener(n,e=>{if(drawing){e.preventDefault();scrub(pos(e))}},{passive:false}));['mouseup','mouseleave','touchend','touchcancel'].forEach(n=>addEventListener(n,()=>{drawing=false;last=null}));
document.querySelector('#startBtn').onclick=start;document.querySelector('#retryBtn').onclick=reset;document.querySelector('#soundBtn').onclick=e=>{soundOn=!soundOn;e.target.textContent='SOUND: '+(soundOn?'ON':'OFF')};addEventListener('resize',resize);resize();anim();
})();
</script></body></html>
